openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SupplyLink marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication and profiles
  - name: products
    description: Marketplace listings
  - name: orders
    description: Buyer and seller orders
  - name: messages
    description: Buyer and seller conversations
  - name: dashboard
    description: Producer analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with an email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user and token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a SupplyLink account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created account and signed-in session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Email is already registered
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: Search marketplace products
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: mode
          in: query
          schema: { type: string, enum: [WHOLESALE, RETAIL] }
        - name: organic
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Matching listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product listing as a producer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a producer's listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdate" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Listing not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Remove a producer's listing
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Listing removed
  /catalog/categories:
    get:
      operationId: listCatalogCategories
      tags: [catalog]
      summary: List active catalogue categories
      responses:
        "200":
          description: Category tree represented as a flat parent-linked list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogCategory" }
  /catalog/products:
    get:
      operationId: listCatalogProducts
      tags: [catalog]
      summary: Search the canonical product catalogue
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categorySlug
          in: query
          schema: { type: string }
        - name: subcategorySlug
          in: query
          schema: { type: string }
        - name: varietySlug
          in: query
          schema: { type: string }
        - name: productForm
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
      responses:
        "200":
          description: Matching canonical products and pagination details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogProductPage" }
  /catalog/products/{slug}:
    get:
      operationId: getCatalogProduct
      tags: [catalog]
      summary: Get a canonical product with varieties and active supplier offers
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product details and supplier offers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogProductDetail" }
        "404":
          description: Product not found
  /catalog/suggestions:
    post:
      operationId: submitCatalogSuggestion
      tags: [catalog]
      summary: Suggest a missing catalogue product for administrator review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSuggestionInput" }
      responses:
        "201":
          description: Suggestion queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSuggestion" }
        "409":
          description: A matching product is already in the catalogue
  /admin/catalog/categories:
    get:
      operationId: listAdminCatalogCategories
      tags: [catalog-admin]
      summary: List all categories for catalogue administration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All catalogue categories, including archived categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogCategory" }
    post:
      operationId: createCatalogCategory
      tags: [catalog-admin]
      summary: Create a category or subcategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCategory" }
  /admin/catalog/categories/{id}:
    patch:
      operationId: updateCatalogCategory
      tags: [catalog-admin]
      summary: Rename, reorganize, or archive a category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCategoryUpdate" }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCategory" }
        "404":
          description: Category not found
  /admin/catalog/products:
    get:
      operationId: listAdminCatalogProducts
      tags: [catalog-admin]
      summary: List all catalogue products for administration
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
      responses:
        "200":
          description: All catalogue products, including archived products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogProductPage" }
    post:
      operationId: createCatalogProduct
      tags: [catalog-admin]
      summary: Add an approved canonical product and its varieties
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogProductAdminInput" }
      responses:
        "201":
          description: Product added to the catalogue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogProductDetail" }
  /admin/catalog/products/{id}:
    patch:
      operationId: updateCatalogProduct
      tags: [catalog-admin]
      summary: Edit or archive a canonical product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogProductAdminUpdate" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogProductDetail" }
        "404":
          description: Product not found
  /admin/catalog/suggestions:
    get:
      operationId: listCatalogSuggestions
      tags: [catalog-admin]
      summary: Review pending product suggestions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
      responses:
        "200":
          description: Product suggestions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogSuggestion" }
  /admin/catalog/suggestions/{id}:
    patch:
      operationId: reviewCatalogSuggestion
      tags: [catalog-admin]
      summary: Approve or reject a product suggestion
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogSuggestionReview" }
      responses:
        "200":
          description: Suggestion reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSuggestion" }
        "404":
          description: Suggestion not found
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List orders for the current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Buyer orders or producer incoming orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order from the marketplace
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: One new order per producer in the cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderBatch" }
        "409":
          description: Stock or minimum-order requirement not met
  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Move an incoming order through its fulfillment pipeline
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderStatusInput" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /messages/threads:
    get:
      operationId: getMessageThreads
      tags: [messages]
      summary: List the current user's conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MessageThread" }
  /messages/{userId}:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get conversation history with another user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
  /messages:
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message or a price quote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get producer overview metrics and sales series
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Producer dashboard data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    User:
      type: object
      required: [id, name, email, role, address, city]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [PRODUCER, RETAILER, CUSTOMER, ADMIN] }
        phone: { type: ["string", "null"] }
        address: { type: string }
        city: { type: string }
        businessName: { type: ["string", "null"] }
        certifications: { type: ["string", "null"] }
        rating: { type: number }
        createdAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    RegisterInput:
      type: object
      required: [name, email, password, role, address, city]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [PRODUCER, RETAILER, CUSTOMER] }
        phone: { type: string }
        address: { type: string, minLength: 3 }
        city: { type: string, minLength: 2 }
        businessName: { type: string }
        certifications: { type: string }
    Product:
      type: object
      required: [id, producerId, producerName, producerCity, producerRating, title, description, category, unit, retailPrice, wholesalePrice, moq, stockQuantity, imageUrl, isOrganic, isActive, catalogProductId, varietyId, varietyName, currency, maxOrderQuantity, qualityGrade, harvestDate, availableFrom, deliveryAreas, deliveryFee, isSample, createdAt]
      properties:
        id: { type: string }
        producerId: { type: string }
        producerName: { type: string }
        producerCity: { type: string }
        producerRating: { type: number }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        unit: { type: string }
        retailPrice: { type: number }
        wholesalePrice: { type: number }
        moq: { type: integer }
        stockQuantity: { type: integer }
        imageUrl: { type: string }
        isOrganic: { type: boolean }
        isActive: { type: boolean }
        catalogProductId: { type: ["string", "null"] }
        varietyId: { type: ["string", "null"] }
        varietyName: { type: ["string", "null"] }
        mainCategory: { type: ["string", "null"] }
        subcategory: { type: ["string", "null"] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        maxOrderQuantity: { type: ["integer", "null"] }
        qualityGrade: { type: ["string", "null"] }
        harvestDate: { type: ["string", "null"], format: date }
        availableFrom: { type: ["string", "null"], format: date }
        deliveryAreas:
          type: array
          items: { type: string }
        deliveryFee: { type: number }
        isSample: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [title, description, category, unit, retailPrice, wholesalePrice, moq, stockQuantity, imageUrl, isOrganic, catalogProductId]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        category: { type: string }
        unit: { type: string }
        retailPrice: { type: number, minimum: 0 }
        wholesalePrice: { type: number, minimum: 0 }
        moq: { type: integer, minimum: 1 }
        stockQuantity: { type: integer, minimum: 0 }
        imageUrl: { type: string }
        isOrganic: { type: boolean }
        isActive: { type: boolean }
        catalogProductId: { type: string, format: uuid }
        varietyId: { type: ["string", "null"], format: uuid }
        currency: { type: string, minLength: 3, maxLength: 3, default: INR }
        maxOrderQuantity: { type: ["integer", "null"], minimum: 1 }
        qualityGrade: { type: ["string", "null"] }
        harvestDate: { type: ["string", "null"], format: date }
        availableFrom: { type: ["string", "null"], format: date }
        deliveryAreas:
          type: array
          items: { type: string }
        deliveryFee: { type: number, minimum: 0, default: 0 }
    ProductUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        retailPrice: { type: number, minimum: 0 }
        wholesalePrice: { type: number, minimum: 0 }
        stockQuantity: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        varietyId: { type: ["string", "null"], format: uuid }
        unit: { type: string }
        moq: { type: integer, minimum: 1 }
        maxOrderQuantity: { type: ["integer", "null"], minimum: 1 }
        qualityGrade: { type: ["string", "null"] }
        harvestDate: { type: ["string", "null"], format: date }
        availableFrom: { type: ["string", "null"], format: date }
        deliveryAreas:
          type: array
          items: { type: string }
        deliveryFee: { type: number, minimum: 0 }
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderInput:
      type: object
      required: [orderType, deliveryAddress, items]
      properties:
        orderType: { type: string, enum: [WHOLESALE, RETAIL] }
        deliveryAddress: { type: string, minLength: 3 }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItemInput" }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACCEPTED, PROCESSING, DISPATCHED, DELIVERED, CANCELLED] }
    OrderLine:
      type: object
      required: [id, productId, title, imageUrl, unit, quantity, unitPrice]
      properties:
        id: { type: string }
        productId: { type: string }
        title: { type: string }
        imageUrl: { type: string }
        unit: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number }
    Order:
      type: object
      required: [id, buyerId, buyerName, sellerId, sellerName, totalAmount, currency, orderType, status, deliveryAddress, createdAt, items]
      properties:
        id: { type: string }
        buyerId: { type: string }
        buyerName: { type: string }
        sellerId: { type: string }
        sellerName: { type: string }
        totalAmount: { type: number }
        currency: { type: string }
        orderType: { type: string, enum: [WHOLESALE, RETAIL] }
        status: { type: string, enum: [PENDING, ACCEPTED, PROCESSING, DISPATCHED, DELIVERED, CANCELLED] }
        deliveryAddress: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
    CatalogCategory:
      type: object
      required: [id, name, slug, parentId, parentSlug, description, sortOrder, isActive, productCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        parentId: { type: ["string", "null"], format: uuid }
        parentSlug: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        productCount: { type: integer }
    CatalogVariety:
      type: object
      required: [id, name, slug, region, attributes, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        region: { type: ["string", "null"] }
        attributes: { type: object, additionalProperties: true }
        isActive: { type: boolean }
    CatalogProductSummary:
      type: object
      required: [id, name, slug, categoryId, categoryName, categorySlug, subcategoryId, subcategoryName, subcategorySlug, description, scientificName, defaultUnit, imageUrl, productForm, seasonalAvailability, storageInfo, isActive, varietyCount, activeListingCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        categorySlug: { type: string }
        subcategoryId: { type: ["string", "null"], format: uuid }
        subcategoryName: { type: ["string", "null"] }
        subcategorySlug: { type: ["string", "null"] }
        description: { type: string }
        scientificName: { type: ["string", "null"] }
        defaultUnit: { type: string }
        imageUrl: { type: ["string", "null"] }
        productForm: { type: ["string", "null"] }
        seasonalAvailability: { type: ["string", "null"] }
        storageInfo: { type: ["string", "null"] }
        isActive: { type: boolean }
        varietyCount: { type: integer }
        activeListingCount: { type: integer }
    CatalogProductPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogProductSummary" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    CatalogProductDetail:
      allOf:
        - $ref: "#/components/schemas/CatalogProductSummary"
        - type: object
          required: [varieties, aliases, offers]
          properties:
            varieties:
              type: array
              items: { $ref: "#/components/schemas/CatalogVariety" }
            aliases:
              type: array
              items: { type: string }
            offers:
              type: array
              items: { $ref: "#/components/schemas/Product" }
    CatalogSuggestion:
      type: object
      required: [id, name, normalizedName, categoryId, categoryName, varietyName, description, status, submittedBy, submitterName, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        normalizedName: { type: string }
        categoryId: { type: ["string", "null"], format: uuid }
        categoryName: { type: ["string", "null"] }
        varietyName: { type: ["string", "null"] }
        description: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        submittedBy: { type: string, format: uuid }
        submitterName: { type: string }
        createdAt: { type: string, format: date-time }
    CatalogSuggestionInput:
      type: object
      required: [name, description]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        categoryId: { type: ["string", "null"], format: uuid }
        varietyName: { type: ["string", "null"], maxLength: 120 }
        description: { type: string, maxLength: 1000 }
    CatalogSuggestionReview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [APPROVED, REJECTED] }
    CatalogCategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
